<script type="text/javascript">
    RED.nodes.registerType('energy-charts-ren-share', {
        category: 'energy_chart',
        color: '#AAEEAA',
        defaults: {
            name: { value: "" },
            country: { value: "de" },
            mode: { value: "forecast" },
            year: { value: "", validate: RED.validators.regex(/^$|^-?\d+$/) }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-bar-chart",
        paletteLabel: "ren share",
        label: function () {
            return this.name || "ren share";
        },
        oneditprepare: function () {
            $("#node-input-mode").on("change", function () {
                $("#node-row-year").toggle($(this).val() === "daily_avg");
            }).trigger("change");
        }
    });
</script>

<script type="text/html" data-help-name="energy-charts-ren-share">
    <p>Renewable share of load: forecast (<code>/ren_share_forecast</code>) or daily averages
        of a year (<code>/ren_share_daily_avg</code>).</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">country <span class="property-type">string</span></dt>
        <dd>Country code, e.g. <code>de</code>. Overrides the configured country.</dd>
        <dt class="optional">mode <span class="property-type">string</span></dt>
        <dd><code>forecast</code> or <code>daily_avg</code>.</dd>
        <dt class="optional">year <span class="property-type">number</span></dt>
        <dd>Year for <code>daily_avg</code>. Defaults to the current year.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>forecast: <code>unix_seconds</code>, <code>ren_share</code>, <code>solar_share</code>,
            <code>wind_onshore_share</code>, <code>wind_offshore_share</code> in %.<br>
            daily_avg: <code>days</code> and <code>data</code> in %.</dd>
    </dl>
    <h3>Details</h3>
    <p>The public API is rate limited (about 2 requests per minute per endpoint). On HTTP 429 the node
        status shows the <code>Retry-After</code> time. Errors are reported to <code>catch</code> nodes;
        <code>msg.request</code> contains the endpoint, the request parameters and the HTTP status.</p>
    <p>Data: <a href="https://energy-charts.info" target="_blank">Energy-Charts.info</a>, licensed under
        <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>.</p>
</script>
